[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "routekit-cli"  # "routekit" on PyPI is an unrelated 2017 project; the command and import stay "routekit"
version = "0.3.1"
description = "Delivery route planning for U.S. addresses: fleets, truck routing and tolls, FEMA relief, freight demand, and an MCP server for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mike Scarnavack", email = "mhscarn@gmail.com"}]
keywords = ["routing", "logistics", "vehicle-routing", "vrptw", "tsp", "2-opt", "trucking", "dispatch", "fema",
            "freight", "geocoding", "cli", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "rich>=13",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
demo = ["pillow>=10"]

[project.scripts]
routekit = "routekit.cli:main"

[project.urls]
Homepage = "https://github.com/M-Scarnavack/routekit"
Source = "https://github.com/M-Scarnavack/routekit"
Issues = "https://github.com/M-Scarnavack/routekit/issues"

[tool.setuptools.packages.find]
include = ["routekit*"]

[tool.setuptools.package-data]
routekit = ["data/*.json", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:urllib3 v2 only supports OpenSSL"]
