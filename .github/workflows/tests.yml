name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 (what macOS ships) isn't built for the newest Ubuntu runners; test it on macOS.
          - { os: macos-latest, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  benchmark:
    # Solve all 56 Solomon VRPTW instances, re-check every plan, and fail if any plan breaks
    # a rule or gets worse than benchmarks/baseline.json (more trucks, or distance up > 0.5%).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python scripts/bench.py --baseline benchmarks/baseline.json --json bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solomon-benchmark
          path: bench-results.json
